<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PHAROS">
  <defs>
    <linearGradient id="pl-bg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#ECEAF9"/>
    </linearGradient>
    <linearGradient id="pl-tower" x1="24" y1="9" x2="24" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C5DD3"/>
      <stop offset="1" stop-color="#453999"/>
    </linearGradient>
    <linearGradient id="pl-beam" x1="26" y1="19" x2="62" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#2EC4B6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pl-glow" cx="24" cy="20.5" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#55D1C9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- light badge -->
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.5" fill="url(#pl-bg)" stroke="#D9D3F5" stroke-width="1.5"/>

  <!-- detection sweep / light beam -->
  <polygon points="26,18.5 62,2 62,17" fill="url(#pl-beam)"/>

  <!-- unmatched detection caught in the beam -->
  <circle cx="52" cy="11" r="4.4" fill="none" stroke="#FF9F1C" stroke-width="1" opacity="0.6"/>
  <circle cx="52" cy="11" r="2.4" fill="#FF9F1C"/>

  <!-- light glow -->
  <circle cx="24" cy="20.5" r="6" fill="url(#pl-glow)"/>

  <!-- lighthouse -->
  <g stroke="#34297C" stroke-width="0.6" stroke-linejoin="round">
    <polygon points="19,49 29,49 26.5,27 21.5,27" fill="url(#pl-tower)"/>
    <polygon points="20.48,36 27.52,36 27.98,40 20.02,40" fill="#FF9F1C"/>
    <rect x="20" y="24.6" width="8" height="2.6" rx="0.6" fill="#453999"/>
    <rect x="21.4" y="16.5" width="5.2" height="8.1" rx="0.8" fill="#8272F0"/>
    <polygon points="20.8,16.5 27.2,16.5 24,10" fill="#34297C"/>
  </g>
  <circle cx="24" cy="20.4" r="1.7" fill="#FFFFFF"/>
  <circle cx="24" cy="9.2" r="1.1" fill="#6C5DD3"/>

  <!-- sea -->
  <g stroke-linecap="round" fill="none">
    <path d="M7,50.5 q4,-3 8,0 t8,0 t8,0 t8,0 t8,0 t8,0" stroke="#2EC4B6" stroke-width="1.6" opacity="0.9"/>
    <path d="M7,54.5 q4,-3 8,0 t8,0 t8,0 t8,0 t8,0 t8,0" stroke="#453999" stroke-width="1.6" opacity="0.8"/>
  </g>
</svg>
