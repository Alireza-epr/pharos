<svg width="380" height="112" viewBox="0 0 380 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PHAROS — Clarity across SAR and AIS">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800&amp;family=Montserrat:wght@600&amp;display=swap');
      .wordmark { font-family: 'Orbitron','Montserrat',sans-serif; font-weight: 800; font-size: 42px; letter-spacing: 7px; }
      .tagline  { font-family: 'Montserrat','Segoe UI',sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 1.5px; }
    </style>
    <linearGradient id="ll-bg" x1="32" y1="0" x2="32" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECEAF9"/>
    </linearGradient>
    <linearGradient id="ll-tower" x1="24" y1="9" x2="24" y2="49" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6C5DD3"/><stop offset="1" stop-color="#453999"/>
    </linearGradient>
    <linearGradient id="ll-beam" x1="26" y1="19" x2="62" y2="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.8"/>
      <stop offset="0.55" stop-color="#2EC4B6" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ll-glow" cx="24" cy="20.5" r="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2EC4B6" stop-opacity="0.95"/><stop offset="0.45" stop-color="#55D1C9" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#2EC4B6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ll-word" x1="104" y1="40" x2="104" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34297C"/><stop offset="1" stop-color="#584AB6"/>
    </linearGradient>
  </defs>

  <!-- icon mark (light badge) -->
  <g transform="translate(16,24)">
    <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="14.5" fill="url(#ll-bg)" stroke="#D9D3F5" stroke-width="1.5"/>
    <polygon points="26,18.5 62,2 62,17" fill="url(#ll-beam)"/>
    <circle cx="52" cy="11" r="4.4" fill="none" stroke="#FF9F1C" stroke-width="1" opacity="0.6"/>
    <circle cx="52" cy="11" r="2.4" fill="#FF9F1C"/>
    <circle cx="24" cy="20.5" r="6" fill="url(#ll-glow)"/>
    <g stroke="#34297C" stroke-width="0.6" stroke-linejoin="round">
      <polygon points="19,49 29,49 26.5,27 21.5,27" fill="url(#ll-tower)"/>
      <polygon points="20.48,36 27.52,36 27.98,40 20.02,40" fill="#FF9F1C"/>
      <rect x="20" y="24.6" width="8" height="2.6" rx="0.6" fill="#453999"/>
      <rect x="21.4" y="16.5" width="5.2" height="8.1" rx="0.8" fill="#8272F0"/>
      <polygon points="20.8,16.5 27.2,16.5 24,10" fill="#34297C"/>
    </g>
    <circle cx="24" cy="20.4" r="1.7" fill="#FFFFFF"/>
    <circle cx="24" cy="9.2" r="1.1" fill="#6C5DD3"/>
    <g stroke-linecap="round" fill="none">
      <path d="M7,50.5 q4,-3 8,0 t8,0 t8,0 t8,0 t8,0 t8,0" stroke="#2EC4B6" stroke-width="1.6" opacity="0.9"/>
      <path d="M7,54.5 q4,-3 8,0 t8,0 t8,0 t8,0 t8,0 t8,0" stroke="#453999" stroke-width="1.6" opacity="0.8"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="104" y="62" class="wordmark" fill="url(#ll-word)">PHAROS</text>
  <text x="106" y="86" class="tagline" fill="#1E7F76">Clarity Across SAR and AIS</text>
</svg>
