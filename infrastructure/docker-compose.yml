services:
  backend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      target: backend
      args:
        # Set GIT_COMMIT_SHA in the environment before building to stamp
        # exports with the real commit (e.g. `git rev-parse HEAD`); else N/A.
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-N/A}
    container_name: pharos-backend
    ports:
      - "1370:1370"
    env_file:
      - ../apps/backend/.env
    restart: unless-stopped

    # ---------- Health check ----------
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:1370/v1/system/health"]
      interval: 30s
      timeout: 2s
      retries: 5

  frontend:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      target: frontend
    container_name: pharos-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped