name: PR Checks

on:
  pull_request:
    branches:
      - master
    paths:
      - 'apps/frontend/**'
      - 'apps/backend/**'
      - 'packages/**'

jobs:
  pr-checks:
    runs-on: ubuntu-latest

    steps:
      # ----- Setup -----
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Build shared packages
        run: npm run packages:build

      # ----- Backend checks -----
      - name: Create .env file for CI
        working-directory: apps/backend
        run: |
          echo "GFW_TOKEN=${{ secrets.GFW_TOKEN }}" >> .env

      - name: Run Backend Lint
        working-directory: apps/backend
        run: npm run lint

      - name: Run Backend Type Check
        working-directory: apps/backend
        run: npm run typecheck

      - name: Verify Backend Startup (Smoke Test)
        working-directory: apps/backend
        run: |
          npm run build
          node dist/src/core/server.js &
          echo $! > server.pid
          sleep 5
          curl -X GET "localhost:1370/v1/system/health"
          kill $(cat server.pid)

      - name: Run Backend Unit Tests
        working-directory: apps/backend
        run: npm test

      # ----- Frontend checks -----
      - name: Run Frontend Lint
        working-directory: apps/frontend
        run: npm run lint

      - name: Run Frontend Lint Style
        working-directory: apps/frontend
        run: npm run lint:style
