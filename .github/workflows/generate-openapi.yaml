name: Generate + Lint OpenAPI

on:
  pull_request:
    paths:
      - "docs/api/query-contract.md"

permissions:
  contents: write

jobs:

  # ─── 1. GENERATE ────────────────────────────────
  generate:
    runs-on: ubuntu-latest

    outputs:
      generated: ${{ steps.generate.outputs.changed }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install openai

      - name: Generate OpenAPI
        id: generate
        run: |
          node scripts/generate-openapi.js

          # detect if file changed
          if diff --quiet docs/api/openapi.yaml docs/api/openapi.generated.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Replace OpenAPI file
        if: steps.generate.outputs.changed == 'true'
        run: mv docs/api/openapi.generated.yaml docs/api/openapi.yaml

  # ─── 2. LINT ────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    needs: generate
    if: needs.generate.outputs.generated == 'true'

    steps:
      - name: Lint OpenAPI
        uses: ./.github/workflows/lint-openapi.yaml

  # ─── 3. COMMIT ──────────────────────────────────
  commit:
    runs-on: ubuntu-latest
    needs: [generate, lint]
    if: needs.generate.outputs.generated == 'true'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Commit updated OpenAPI
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/api/openapi.yaml
          git commit -m "auto: update openapi from query-contract" || echo "No changes"
          git push