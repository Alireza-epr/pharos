openapi: 3.0.3

info:
  title: Pharos API
  version: 1.0.0
  description: >
    Pharos API provides filtered, sorted, and paginated marine event report data
    based on geospatial configuration, scoring thresholds, and filtering rules.
    Data is sourced from Global Fishing Watch and subject to their rate-limiting policies.
  contact:
    name: Pharos API Support
  license:
    name: See Global Fishing Watch API Terms
    url: https://globalfishingwatch.org/our-apis/documentation

servers:
  - url: http://localhost:{port}/v1
    variables:
      port:
        default: "1370"
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: example.com

tags:
  - name: System
  - name: Auth
  - name: Events

paths:
  /system/health:
    get:
      tags: [System]
      summary: System health check
      description: >
        Liveness check endpoint used to verify that the API service is running and reachable
      operationId: getSystemHealth
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unhealthy

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      description: >
        Authenticates a user with a username and password. On success it returns a
        short-lived access token (default 1 hour) and a long-lived refresh token
        (default 7 days). Send the access token on protected endpoints as
        `Authorization: Bearer <accessToken>`.
      operationId: login
      security: []
      parameters:
        - name: username
          in: query
          schema:
            type: string

        - name: password
          in: query
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; access and refresh tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Username or password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: >
        Issues a new access token when given a valid, unexpired refresh token. When
        the refresh token is missing the response is 400; when it is invalid or
        expired the response is 401 and the client must log in again.
      operationId: refreshToken
      security: []
      parameters:
        - name: refreshToken
          in: query
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          description: Refresh token missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/check-token:
    post:
      tags: [Auth]
      summary: Validate an access token
      description: >
        Verifies that a token is well-formed and unexpired. Returns success when the
        token is valid; otherwise returns 400.
      operationId: checkToken
      security: []
      parameters:
        - name: accessToken
          in: query
          schema:
            type: string

        - name: refreshToken
          in: query
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckTokenRequest"
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckTokenResponse"
        "400":
          description: Token missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events:
    post:
      tags: [Events]
      summary: Get events report
      description: >
        Returns filtered, sorted, and paginated event report data based on geospatial configuration, thresholds, and filtering rules.
        Requires a valid access token in the `Authorization: Bearer <accessToken>` header.
      operationId: getEventsReport
      security:
        - bearerAuth: []

      parameters:
        - name: datasets[0]
          in: query
          required: true
          description: >
            Indexed dataset identifier(s) to query. Repeat with an incrementing
            index for multiple datasets: datasets[0], datasets[1], ...
          schema:
            type: string

        - name: filters[0]
          in: query
          description: >
            Indexed filter expression(s) applied to the upstream query:
            filters[0], filters[1], ...
          schema:
            type: string

        - name: format
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Format"

        - name: temporal-resolution
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TemporalResolution"

        - name: spatial-resolution
          in: query
          schema:
            $ref: "#/components/schemas/SpatialResolution"

        - name: group-by
          in: query
          schema:
            $ref: "#/components/schemas/GroupBy"

        - name: spatial-aggregation
          in: query
          schema:
            type: boolean

        - name: region-dataset
          in: query
          required: true
          schema:
            type: string

        - name: region-id
          in: query
          required: true
          schema:
            type: string

        - name: buffer-operation
          in: query
          schema:
            type: string

        - name: buffer-unit
          in: query
          schema:
            $ref: "#/components/schemas/BufferUnit"

        - name: buffer-value
          in: query
          schema:
            type: string

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsReportRequest"

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsReportResponse"

        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

        "500":
          description: Server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login or /auth/refresh.

  schemas:

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [success, accessToken, refreshToken]
      properties:
        success:
          type: boolean
        accessToken:
          type: string
          description: "Short-lived JWT (default 1h). Send as `Authorization: Bearer <accessToken>`."
        refreshToken:
          type: string
          description: Long-lived JWT (default 7d) used to obtain new access tokens via /auth/refresh.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [success, accessToken]
      properties:
        success:
          type: boolean
        accessToken:
          type: string

    CheckTokenRequest:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    CheckTokenResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    BufferUnit:
      type: string
      enum: [MILES, NAUTICALMILES, KILOMETERS, RADIANS, DEGREES]

    Format:
      type: string
      enum: [CSV, TIF, JSON]

    TemporalResolution:
      type: string
      enum: [HOURLY, DAILY, MONTHLY, YEARLY, ENTIRE]

    SpatialResolution:
      type: string
      enum: [LOW, HIGH]

    GroupBy:
      type: string
      enum: [VESSEL_ID, FLAG, GEARTYPE, FLAGANDGEARTYPE, MMSI]

    FetchMethod:
      type: string
      enum: [GET, POST]

    HealthResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    EventsReportRequest:
      type: object
      properties:
        URL:
          type: string
          description: Upstream 4Wings report endpoint URL used as the data source.
        method:
          $ref: "#/components/schemas/FetchMethod"
        body_params:
          $ref: "#/components/schemas/BodyParams"
        filter:
          $ref: "#/components/schemas/Filter"
        sort:
          $ref: "#/components/schemas/SortArray"
        hotspot:
          $ref: "#/components/schemas/Hotspot"
        threshold:
          $ref: "#/components/schemas/Threshold"
        pagination:
          $ref: "#/components/schemas/PaginationParams"

    BodyParams:
      type: object
      properties:
        geojson:
          $ref: "#/components/schemas/GeoJsonGeometry"
        region:
          $ref: "#/components/schemas/Region"

    GeoJsonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum:
            - Point
            - LineString
            - Polygon
            - MultiPoint
            - MultiLineString
            - MultiPolygon
        coordinates:
          type: array
          items: {}

    Region:
      type: object
      properties:
        dataset:
          type: string
          enum: [public-eez-areas, public-mpa-all]
        id:
          type: string
        bufferOperation:
          type: string
        bufferUnit:
          $ref: "#/components/schemas/BufferUnit"
        bufferValue:
          type: string

    Filter:
      type: object
      properties:
        triage_score_min:
          type: number
        triage_score_max:
          type: number
        only_inside_eez:
          type: boolean
        only_inside_mpa:
          type: boolean

    SortArray:
      type: array
      items:
        $ref: "#/components/schemas/SortRule"

    SortRule:
      type: object
      required: [sortBy]
      properties:
        sortBy:
          type: string
        direction:
          type: string
          enum: [asc, desc]

    Hotspot:
      type: object
      required: [resolution, timeBin]
      properties:
        resolution:
          type: integer
          minimum: 0
          maximum: 15
        timeBin:
          type: string
          enum: [HOURLY, DAILY]

    Threshold:
      type: object
      properties:
        near_coast_threshold:
          type: number
        low_triage_score_threshold:
          type: number
        medium_triage_score_threshold:
          type: number
        high_triage_score_threshold:
          type: number

    EventsReportResponse:
      type: object
      required: [success, pagination, entries]
      properties:
        success:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
        stats:
          type: object
          additionalProperties:
            type: string
        entries:
          type: array
          items:
            type: object
            additionalProperties:
              type: string

    PaginationParams:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
          minimum: 1
          description: Items per page. Defaults to 100 when the pagination object is omitted.
        offset:
          type: integer
          minimum: 0
          description: Items to skip before collecting results. Defaults to 0 when the pagination object is omitted.

    Pagination:
      type: object
      required:
        - total
        - limit
        - offset
        - pageSize
        - totalPages
        - currentPage
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        nextOffset:
          type: integer
          nullable: true
        prevOffset:
          type: integer
          nullable: true
        pageSize:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    RateLimitErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
          description: Human-readable error message