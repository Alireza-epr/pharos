openapi: 3.0.3

info:
  title: Pharos API
  version: 1.0.0
  description: >
    Pharos API provides filtered, sorted, and paginated marine event report data
    based on geospatial configuration, scoring thresholds, and filtering rules.
    Data is sourced from Global Fishing Watch and subject to their rate-limiting policies.
  contact:
    name: Pharos API Support
  license:
    name: See Global Fishing Watch API Terms
    url: https://globalfishingwatch.org/our-apis/documentation

servers:
  - url: http://localhost:{port}/v1
    variables:
      port:
        default: "1370"
  - url: https://{domain}/api/v1
    variables:
      domain:
        default: example.com

tags:
  - name: System
  - name: Auth
  - name: Events
  - name: Exports
  - name: Regions

paths:
  /system/health:
    get:
      tags: [System]
      summary: System health check
      description: >
        Liveness check endpoint used to verify that the API service is running and reachable
      operationId: getSystemHealth
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: Service unhealthy

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with username and password
      description: >
        Authenticates a user with a username and password. On success it returns a
        short-lived access token (default 1 hour) and a long-lived refresh token
        (default 7 days). Send the access token on protected endpoints as
        `Authorization: Bearer <accessToken>`.
      operationId: login
      security: []
      parameters:
        - name: username
          in: query
          schema:
            type: string

        - name: password
          in: query
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated; access and refresh tokens issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Username or password missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      description: >
        Issues a new access token when given a valid, unexpired refresh token. When
        the refresh token is missing the response is 400; when it is invalid or
        expired the response is 401 and the client must log in again.
      operationId: refreshToken
      security: []
      parameters:
        - name: refreshToken
          in: query
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New access token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
        "400":
          description: Refresh token missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Refresh token invalid or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/check-token:
    post:
      tags: [Auth]
      summary: Validate an access token
      description: >
        Verifies that a token is well-formed and unexpired. Returns success when the
        token is valid; otherwise returns 400.
      operationId: checkToken
      security: []
      parameters:
        - name: accessToken
          in: query
          schema:
            type: string

        - name: refreshToken
          in: query
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckTokenRequest"
      responses:
        "200":
          description: Token is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckTokenResponse"
        "400":
          description: Token missing, invalid, or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /events:
    post:
      tags: [Events]
      summary: Get events report
      description: >
        Returns filtered, sorted, and paginated event report data based on geospatial configuration, thresholds, and filtering rules.
        Requires a valid access token in the `Authorization: Bearer <accessToken>` header.
      operationId: getEventsReport
      security:
        - bearerAuth: []

      parameters:
        - name: datasets[0]
          in: query
          required: true
          description: >
            Indexed dataset identifier(s) to query. Repeat with an incrementing
            index for multiple datasets: datasets[0], datasets[1], ...
          schema:
            type: string

        - name: filters[0]
          in: query
          description: >
            Indexed filter expression(s) applied to the upstream query:
            filters[0], filters[1], ...
          schema:
            type: string

        - name: format
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Format"

        - name: temporal-resolution
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TemporalResolution"

        - name: spatial-resolution
          in: query
          schema:
            $ref: "#/components/schemas/SpatialResolution"

        - name: group-by
          in: query
          schema:
            $ref: "#/components/schemas/GroupBy"

        - name: spatial-aggregation
          in: query
          schema:
            type: boolean

        - name: region-dataset
          in: query
          required: true
          schema:
            type: string

        - name: region-id
          in: query
          required: true
          schema:
            type: string

        - name: buffer-operation
          in: query
          schema:
            type: string

        - name: buffer-unit
          in: query
          schema:
            $ref: "#/components/schemas/BufferUnit"

        - name: buffer-value
          in: query
          schema:
            type: string

      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsReportRequest"

      responses:
        "200":
          description: >
            A newline-delimited JSON (NDJSON) progress stream, not a single JSON
            body: one `{ "type": "step", "id": ..., "status": ... }` line per
            checklist step (see docs/api/query-contract.md, Events Report ->
            Response), followed by exactly one
            `{ "type": "result", "payload": ... }` line whose `payload` is the
            same envelope this endpoint used to return in one shot
            (`EventsReportResponse` on success, `ErrorResponse`-shaped on
            failure). The HTTP status is committed to 200 the moment the
            stream opens, before the outcome is known, so `payload.success` in
            that final line — not this status code — is the real result; a
            failed step (e.g. invalid params, an internal error) surfaces as
            `payload.success: false` there instead of a 400/500 status.
          content:
            application/x-ndjson:
              schema:
                type: string
                description: One JSON object per line, as described above.

        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateLimitErrorResponse"

  /exports/events:
    post:
      tags: [Exports]
      summary: Export selected events as a ZIP bundle
      description: >
        Builds a ZIP archive from the supplied events (and optional hotspots) containing
        the files selected in `config.export`, and streams it as a binary download.
        On success the response body is the ZIP archive (`application/zip`), not JSON;
        the generated file name is returned in the `Content-Disposition` header.
        Requires a valid access token in the `Authorization: Bearer <accessToken>` header.
      operationId: exportEvents
      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsExportRequest"

      responses:
        "200":
          description: ZIP archive containing the selected export files
          headers:
            Content-Disposition:
              description: >
                Attachment carrying the generated export id file name, e.g.
                `attachment; filename="<exportId>.zip"`.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary

        "400":
          description: No events available (events missing or empty)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "500":
          description: Export bundle could not be generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /regions:
    get:
      tags: [Regions]
      summary: List selectable EEZ or MPA region options
      description: >
        Returns the selectable EEZ or MPA region options for building an Area of
        Interest query -- one entry per region with its id, title, bounding box,
        and a centroid point (not the real boundary geometry). Requires a valid
        access token in the `Authorization: Bearer <accessToken>` header.
      operationId: getRegions
      security:
        - bearerAuth: []

      parameters:
        - name: dataset
          in: query
          required: true
          description: Which region collection to list.
          schema:
            $ref: "#/components/schemas/RegionDataset"

      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionsResponse"

        "400":
          description: >
            dataset is missing or not a recognized value, or is a recognized
            value with no region list to serve (e.g. Bathymetry)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

        "401":
          description: Missing, invalid, or expired access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained from /auth/login or /auth/refresh.

  schemas:

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      required: [success, accessToken, refreshToken]
      properties:
        success:
          type: boolean
        accessToken:
          type: string
          description: "Short-lived JWT (default 1h). Send as `Authorization: Bearer <accessToken>`."
        refreshToken:
          type: string
          description: Long-lived JWT (default 7d) used to obtain new access tokens via /auth/refresh.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    RefreshResponse:
      type: object
      required: [success, accessToken]
      properties:
        success:
          type: boolean
        accessToken:
          type: string

    CheckTokenRequest:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    CheckTokenResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    BufferUnit:
      type: string
      enum: [MILES, NAUTICALMILES, KILOMETERS, RADIANS, DEGREES]

    Format:
      type: string
      enum: [CSV, TIF, JSON]

    TemporalResolution:
      type: string
      enum: [HOURLY, DAILY, MONTHLY, YEARLY, ENTIRE]

    SpatialResolution:
      type: string
      enum: [LOW, HIGH]

    GroupBy:
      type: string
      enum: [VESSEL_ID, FLAG, GEARTYPE, FLAGANDGEARTYPE, MMSI]

    FetchMethod:
      type: string
      enum: [GET, POST]

    HealthResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    EventsReportRequest:
      type: object
      properties:
        URL:
          type: string
          description: Upstream 4Wings report endpoint URL used as the data source.
        method:
          $ref: "#/components/schemas/FetchMethod"
        body_params:
          $ref: "#/components/schemas/BodyParams"
        filter:
          $ref: "#/components/schemas/Filter"
        sort:
          $ref: "#/components/schemas/SortArray"
        hotspot:
          $ref: "#/components/schemas/Hotspot"
        threshold:
          $ref: "#/components/schemas/Threshold"
        pagination:
          $ref: "#/components/schemas/PaginationParams"

    BodyParams:
      type: object
      properties:
        geojson:
          $ref: "#/components/schemas/GeoJsonGeometry"
        region:
          $ref: "#/components/schemas/Region"

    GeoJsonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum:
            - Point
            - LineString
            - Polygon
            - MultiPoint
            - MultiLineString
            - MultiPolygon
        coordinates:
          type: array
          items: {}

    Region:
      type: object
      properties:
        dataset:
          type: string
          enum: [public-eez-areas, public-mpa-all]
        id:
          type: string
        bufferOperation:
          type: string
        bufferUnit:
          $ref: "#/components/schemas/BufferUnit"
        bufferValue:
          type: string

    Filter:
      type: object
      properties:
        triage_score_min:
          type: number
        triage_score_max:
          type: number
        only_inside_eez:
          type: boolean
        only_inside_mpa:
          type: boolean

    SortArray:
      type: array
      items:
        $ref: "#/components/schemas/SortRule"

    SortRule:
      type: object
      required: [sortBy]
      properties:
        sortBy:
          type: string
        direction:
          type: string
          enum: [asc, desc]

    Hotspot:
      type: object
      required: [resolution, timeBin]
      properties:
        resolution:
          type: integer
          minimum: 0
          maximum: 15
        timeBin:
          type: string
          enum: [HOURLY, DAILY]

    Threshold:
      type: object
      properties:
        near_coast_threshold:
          type: number
        low_triage_score_threshold:
          type: number
        medium_triage_score_threshold:
          type: number
        high_triage_score_threshold:
          type: number

    EventsReportResponse:
      type: object
      required: [success, pagination, entries]
      properties:
        success:
          type: boolean
        metadata:
          type: object
          additionalProperties:
            type: string
        pagination:
          $ref: "#/components/schemas/Pagination"
        stats:
          type: object
          additionalProperties:
            type: string
        entries:
          type: array
          items:
            type: object
            additionalProperties:
              type: string

    EventsExportRequest:
      type: object
      required: [config, events]
      properties:
        config:
          $ref: "#/components/schemas/ExportConfig"
        events:
          type: array
          description: Canonical event records to include in the bundle.
          items:
            type: object
            additionalProperties:
              type: string
        hotspots:
          type: array
          description: Hotspot records to include when hotspot files are selected.
          items:
            type: object
            additionalProperties:
              type: string

    ExportConfig:
      allOf:
        - $ref: "#/components/schemas/EventsReportRequest"
        - type: object
          properties:
            export:
              $ref: "#/components/schemas/ExportFiles"

    ExportFiles:
      type: object
      description: >
        Selects which files are written into the archive; each key toggles one output
        file. When omitted, the bundle defaults to events.csv, event.geojson, and
        run_metadata.json.
      properties:
        "canonicalSchema.json":
          type: boolean
        "event.geojson":
          type: boolean
        "event.parquet":
          type: boolean
        "events.csv":
          type: boolean
        "stats.json":
          type: boolean
        "hotspots.geojson":
          type: boolean
        "hotspots.parquet":
          type: boolean
        "run_metadata.json":
          type: boolean

    PaginationParams:
      type: object
      required: [limit, offset]
      properties:
        limit:
          type: integer
          minimum: 1
          description: Items per page. Defaults to 100 when the pagination object is omitted.
        offset:
          type: integer
          minimum: 0
          description: Items to skip before collecting results. Defaults to 0 when the pagination object is omitted.

    Pagination:
      type: object
      required:
        - total
        - limit
        - offset
        - pageSize
        - totalPages
        - currentPage
      properties:
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        nextOffset:
          type: integer
          nullable: true
        prevOffset:
          type: integer
          nullable: true
        pageSize:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer

    RegionDataset:
      type: string
      enum: [EEZ, MPA]

    RegionFeatureProperties:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string

    RegionPointGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum: [Point]
        coordinates:
          type: array
          description: "[longitude, latitude] of the region's centroid."
          items:
            type: number
          minItems: 2
          maxItems: 2

    RegionFeature:
      type: object
      description: >
        A single selectable region: a GeoJSON Feature whose geometry is a cheap
        centroid Point (not the real boundary), plus the bbox a client fits/zooms
        a map to.
      required: [type, properties, geometry]
      properties:
        type:
          type: string
          enum: [Feature]
        properties:
          $ref: "#/components/schemas/RegionFeatureProperties"
        bbox:
          type: array
          description: "[minLng, minLat, maxLng, maxLat]"
          items:
            type: number
          minItems: 4
          maxItems: 4
        geometry:
          $ref: "#/components/schemas/RegionPointGeometry"

    RegionsResponse:
      type: object
      required: [success, entries]
      properties:
        success:
          type: boolean
        entries:
          type: array
          items:
            $ref: "#/components/schemas/RegionFeature"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
        error:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    RateLimitErrorResponse:
      allOf:
        - $ref: "#/components/schemas/ErrorResponse"

    ErrorDetail:
      type: object
      properties:
        field:
          type: string
        message:
          type: string
          description: Human-readable error message