openapi: 3.0.3

info:
  title: Pharos API
  version: 1.0.0
  description: >
    Pharos API provides filtered, sorted, and paginated marine event report data.

servers:
  - url: http://localhost:{port}/v1
    variables:
      port:
        default: "8080"

tags:
  - name: System
  - name: Events

paths:

  /system/health:
    get:
      tags: [System]
      summary: System health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /events:
    post:
      tags: [Events]
      summary: Get events report
      security: []
      parameters:
        - name: limit
          in: query
          required: true
          schema:
            type: integer
            minimum: 1

        - name: offset
          in: query
          required: true
          schema:
            type: integer
            minimum: 0

        - name: region-dataset
          in: query
          required: true
          schema:
            type: string

        - name: region-id
          in: query
          required: true
          schema:
            type: string

      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventsReportRequest"

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsReportResponse"

        "400":
          description: Bad Request

        "429":
          description: Rate limit exceeded

        "500":
          description: Server error

components:

  schemas:

    HealthResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    EventsReportRequest:
      type: object
      properties:
        body_params:
          $ref: "#/components/schemas/BodyParams"
        filter:
          $ref: "#/components/schemas/Filter"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/SortRule"
        hotspot:
          $ref: "#/components/schemas/Hotspot"
        threshold:
          $ref: "#/components/schemas/Threshold"

    BodyParams:
      type: object
      properties:
        geojson:
          $ref: "#/components/schemas/GeoJsonGeometry"
        region:
          $ref: "#/components/schemas/Region"

    GeoJsonGeometry:
      type: object
      required: [type, coordinates]
      properties:
        type:
          type: string
          enum:
            - Point
            - LineString
            - Polygon
            - MultiPoint
            - MultiLineString
            - MultiPolygon

        # FIX: removed oneOf (Spectral crash source)
        coordinates:
          type: array
          description: GeoJSON coordinates (untyped array to avoid Spectral bug)

    Region:
      type: object
      properties:
        dataset:
          type: string
        id:
          type: string
        bufferOperation:
          type: string
        bufferUnit:
          type: string
        bufferValue:
          type: string

    Filter:
      type: object
      properties:
        triage_score_min:
          type: number
        triage_score_max:
          type: number
        uncertainty_score_min:
          type: number
        uncertainty_score_max:
          type: number
        distance_to_coast_km_min:
          type: number
        distance_to_coast_km_max:
          type: number
        reason_codes_include:
          type: array
          items:
            type: string
        reason_codes_exclude:
          type: array
          items:
            type: string
        is_inside_eez:
          type: boolean
        is_inside_mpa:
          type: boolean

    SortArray:
      type: array
      items:
        $ref: "#/components/schemas/SortRule"

    SortRule:
      type: object
      required: [sortBy]
      properties:
        sortBy:
          type: string
        direction:
          type: string
          enum: [asc, desc]

    Hotspot:
      type: object
      required: [resolution, timeBin]
      properties:
        resolution:
          type: integer
        timeBin:
          type: string
          enum: [HOURLY, DAILY]

    Threshold:
      type: object
      properties:
        near_coast_threshold:
          type: number
        low_triage_score_threshold:
          type: number
        medium_triage_score_threshold:
          type: number
        high_triage_score_threshold:
          type: number

    EventsReportResponse:
      type: object
      required: [success, pagination, entries]
      properties:
        success:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
        pagination:
          type: object
          properties:
            total:
              type: integer
            limit:
              type: integer
            offset:
              type: integer
            nextOffset:
              type: integer
              nullable: true
            prevOffset:
              type: integer
              nullable: true
            pageSize:
              type: integer
            totalPages:
              type: integer
            currentPage:
              type: integer

        stats:
          type: object
          additionalProperties: true

        entries:
          type: array
          items:
            type: object
            additionalProperties: true